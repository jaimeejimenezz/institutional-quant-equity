[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "institutional-quant-equity"
version = "0.1.0"
description = "Institutional quantitative equity research and portfolio construction platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jaime Jiménez Santos" }
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "yfinance==1.5.2",
    "matplotlib>=3.11.1",
    "PyYAML>=6.0"
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"


[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "data",
    "models"
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"