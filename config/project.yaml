project:
  name: "Institutional Quant Equity Research Platform"
  slug: "institutional-quant-equity"
  version: "0.1.0"
  description: "End-to-end quantitative equity research and portfolio construction platform."

runtime:
  random_seed: 42
  log_level: "INFO"

storage:
  tabular_format: "parquet"
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  reference_data_dir: "data/reference"
  reports_dir: "reports"

research:
  market: "US"
  currency: "USD"
  start_date: "2014-01-01"
  rebalance_frequency: "monthly"
  prediction_horizon_sessions: 21

universe:
  version: "v1"
  expected_count: 50
  construction_method: "static_curated_large_cap"
  membership_mode: "current_constituents_applied_historically"
  eligibility_start_date: "2014-01-01"
  require_active: true

market_data:
  provider: "yfinance"
  start_date: "2014-01-01"
  end_date: null
  interval: "1d"
  auto_adjust: false
  actions: true
  repair: false
  keep_na: true
  timeout_seconds: 30
  max_retries: 3
  retry_wait_seconds: 5
  minimum_observations: 1000
  minimum_coverage_ratio: 0.90
  extreme_return_threshold: 0.35
  maximum_missing_ratio: 0.001
  adjustment_factor_jump_threshold: 0.05

labels:
  horizon_sessions: 21
  relative_to: "cross_sectional_median"
  top_quantile_fraction: 0.20

portfolio:
  long_only: true
  fully_invested: true
  target_positions: 20
  maximum_weight_per_asset: 0.05
  maximum_weight_per_sector: 0.25
  transaction_cost_bps: 10

benchmarks:
  market: "SPY"
  include_equal_weight_universe: true

technical_features:
  annualization_sessions: 252
  momentum_12m_sessions: 252
  momentum_6m_sessions: 126
  skip_recent_sessions: 21
  return_3m_sessions: 63
  return_1m_sessions: 21
  return_1w_sessions: 5
  volatility_short_sessions: 20
  volatility_long_sessions: 60
  drawdown_sessions: 126
  moving_average_short_sessions: 50
  moving_average_long_sessions: 200
  liquidity_short_sessions: 20
  liquidity_long_sessions: 60

technical_feature_processing:
  winsor_lower_quantile: 0.01
  winsor_upper_quantile: 0.99
  minimum_cross_section_size: 10
  minimum_sector_size: 2
  sector_neutralization: true

technical_factor_research:
  target_column: target_21d_excess
  absolute_return_column: target_21d
  number_of_quantiles: 5
  minimum_cross_section_size: 20
  annualization_periods: 12
  research_start_date: "2014-01-31"
  research_end_date: "2019-12-31"

technical_factor_diagnostics:
  correlation_threshold: 0.90
  minimum_pair_observations: 20
  minimum_sector_cross_section_size: 3
  minimum_sector_months: 12
  top_signals_in_figures: 10

  subperiods:
    - name: "2014-2016"
      start_date: "2014-01-31"
      end_date: "2016-12-31"

    - name: "2017-2019"
      start_date: "2017-01-01"
      end_date: "2019-12-31"

linear_modeling:
  target_column: "target_21d_excess"
  top_label_column: "label_top_quintile"

  out_of_sample_start_date: "2020-01-01"

  validation_months: 12
  minimum_training_months: 60
  minimum_cross_section_size: 30

linear_models:
  target_column: "target_21d_excess"
  top_label_column: "label_top_quintile"
  momentum_signal: "return_3m_sector_neutral"

  ridge_alphas:
    - 0.01
    - 0.10
    - 1.00
    - 10.00
    - 100.00

  elastic_net_alphas:
    - 0.0001
    - 0.001
    - 0.010
    - 0.100

  elastic_net_l1_ratios:
    - 0.10
    - 0.50
    - 0.90

  max_iterations: 50000
  tolerance: 0.000001

linear_model_evaluation:
  target_column: "target_21d_excess"
  top_label_column: "label_top_quintile"

  quintiles: 5
  top_fraction: 0.20
  annualization_periods: 12
  minimum_cross_section_size: 30

portfolio_construction:
  primary_model_name: "elastic_net"
  challenger_model_name: "ridge"
  momentum_model_name: "momentum_3m"

  top_n: 20
  score_weighted_candidate_count: 25
  candidate_count: 25
  equal_weight_positions: 25

  max_weight: 0.05
  max_security_weight: 0.05
  max_sector_weight: 0.25

  minimum_positions: 20
  minimum_cross_section_size: 30
  weight_tolerance: 1.0e-8

  optimization_tolerance: 1.0e-10
  optimization_max_iterations: 2000
mvp_backtest:
  initial_capital: 1000000.0
  transaction_cost_bps: 10.0

  final_holding_sessions: 21

  date_column: "date"
  ticker_column: "ticker"
  open_column: "open"
  close_column: "close"
  adjusted_close_column: "adjusted_close"

  minimum_trade_notional: 0.01
  cash_tolerance: 0.05
  weight_tolerance: 1.0e-8
  share_tolerance: 1.0e-12

  bisection_tolerance: 1.0e-8
  bisection_max_iterations: 200

mvp_performance_evaluation:
  benchmark_name: "spy_buy_and_hold"
  benchmark_ticker: "SPY"

  annualization_periods: 252
  risk_free_rate: 0.0

  cost_scenarios_bps:
    - 0.0
    - 5.0
    - 10.0
    - 20.0
    - 50.0

  numerical_tolerance: 1.0e-12

sec_fundamentals:
  provider: "sec_edgar"
  companyfacts_base_url: "https://data.sec.gov/api/xbrl/companyfacts"

  user_agent_env_var: "SEC_USER_AGENT"

  timeout_seconds: 30.0
  request_interval_seconds: 0.20

  maximum_retries: 4
  retry_backoff_seconds: 1.0

  overwrite_raw: false

  canonicalization:
    mapping_path: "data/reference/xbrl_concept_mapping.yaml"

    quarter_min_days: 70
    quarter_max_days: 110

    half_year_min_days: 150
    half_year_max_days: 210

    nine_month_min_days: 230
    nine_month_max_days: 300

    annual_min_days: 330
    annual_max_days: 400

  point_in_time:
    availability_lag_days: 1
    require_statement_type_match: true
    exclude_other_duration: true
  
  quarterly_reconstruction:
    additive_metrics:
      - revenue
      - gross_profit
      - operating_income
      - net_income
      - operating_cash_flow
      - capex
      - interest_expense

    quarter_gap_min_days: 60
    quarter_gap_max_days: 120

    ttm_span_min_days: 240
    ttm_span_max_days: 330

fundamental_factors:
  diluted_share_metric: diluted_shares
  diluted_share_duration_class: quarter
  capex_positive_outflow: true
  min_abs_denominator: 1.0e-12

  growth:
    lag_periods: 12
    acceleration_lag_periods: 12
    min_lag_days: 330
    max_lag_days: 400
    min_abs_denominator: 1.0e-12

  transform:
    winsor_lower_quantile: 0.025
    winsor_upper_quantile: 0.975
    min_cross_section_observations: 10
    min_sector_observations: 3
    zscore_ddof: 0
    zero_std_value: 0.0

  audit:
    high_correlation_threshold: 0.80
    min_pair_dates: 24
    min_pair_observations: 10
    zscore_mean_tolerance: 1.0e-10

risk_model:
  volatility_window_sessions: 252
  beta_window_sessions: 252
  liquidity_window_sessions: 60
  minimum_return_observations: 126
  minimum_liquidity_observations: 20
  annualization_factor: 252
  covariance_window_sessions: 252
  covariance_minimum_observations: 126
  covariance_method: "ledoit_wolf"

portfolio_risk:
  reference_portfolio_value: 1000000
  reference_top_n: 20
  max_daily_adv_participation: 0.10
  weight_sum_tolerance: 0.00000001

portfolio_optimizer:
  candidate_count: 25
  annualized_alpha_scale: 0.10
  risk_aversion: 0.50
  turnover_penalty: 0.01
  max_security_weight: 0.05
  max_sector_weight: 0.25
  weight_tolerance: 0.00000001
  solver_tolerance: 0.000000001
  constraint_margin: 0.000001

  minimum_portfolio_beta: 0.85
  maximum_portfolio_beta: 1.15

  reference_portfolio_value: 1000000
  max_position_adv_fraction: 0.01

portfolio_cvar:
  confidence_level: 0.95
  horizon_days: 21
  scenario_lookback: 252
  minimum_scenarios: 126
  cvar_penalty: 0.05

portfolio_median_mad:
  lookback_days: 252
  minimum_observations: 126

  mad_limit: 0.008
  mad_violation_penalty: 10.0

  turnover_penalty: 0.001

  seed: 42

  max_iterations: 80
  population_size: 8
  tolerance: 1.0e-7

  mutation_min: 0.5
  mutation_max: 1.0
  recombination: 0.7
  polish: false

execution_costs:
  commission_bps: 0.5
  half_spread_bps: 2.0
  slippage_bps: 2.5
  market_impact_coefficient: 0.10
  annualization_factor: 252
