project:
  name: "Institutional Quant Equity Research Platform"
  slug: "institutional-quant-equity"
  version: "0.1.0"
  description: "End-to-end quantitative equity research and portfolio construction platform."

runtime:
  random_seed: 42
  log_level: "INFO"

storage:
  tabular_format: "parquet"
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  reference_data_dir: "data/reference"
  reports_dir: "reports"

research:
  market: "US"
  currency: "USD"
  start_date: "2014-01-01"
  rebalance_frequency: "monthly"
  prediction_horizon_sessions: 21

universe:
  version: "v1"
  expected_count: 50
  construction_method: "static_curated_large_cap"
  membership_mode: "current_constituents_applied_historically"
  eligibility_start_date: "2014-01-01"
  require_active: true

market_data:
  provider: "yfinance"
  start_date: "2014-01-01"
  end_date: null
  interval: "1d"
  auto_adjust: false
  actions: true
  repair: false
  keep_na: true
  timeout_seconds: 30
  max_retries: 3
  retry_wait_seconds: 5
  minimum_observations: 1000
  minimum_coverage_ratio: 0.90
  extreme_return_threshold: 0.35
  maximum_missing_ratio: 0.001
  adjustment_factor_jump_threshold: 0.05

labels:
  horizon_sessions: 21
  relative_to: "cross_sectional_median"
  top_quantile_fraction: 0.20

portfolio:
  long_only: true
  fully_invested: true
  target_positions: 20
  maximum_weight_per_asset: 0.05
  maximum_weight_per_sector: 0.25
  transaction_cost_bps: 10

benchmarks:
  market: "SPY"
  include_equal_weight_universe: true

technical_features:
  annualization_sessions: 252
  momentum_12m_sessions: 252
  momentum_6m_sessions: 126
  skip_recent_sessions: 21
  return_3m_sessions: 63
  return_1m_sessions: 21
  return_1w_sessions: 5
  volatility_short_sessions: 20
  volatility_long_sessions: 60
  drawdown_sessions: 126
  moving_average_short_sessions: 50
  moving_average_long_sessions: 200
  liquidity_short_sessions: 20
  liquidity_long_sessions: 60